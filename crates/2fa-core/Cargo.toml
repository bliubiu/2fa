[package]
name = "two-fa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "完全离线的 TOTP 两步验证核心库：零终端依赖、零环境感知"

[lib]
name = "two_fa_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.6.0"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
