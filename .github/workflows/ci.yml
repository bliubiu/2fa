name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test
      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: 供应链审计
        run: cargo audit
      - name: 安装 cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # deny.toml：漏洞/废带版本/重复版本/来源白名单准入，任何 deny 级命中即失败
      - name: 依赖准入检查
        run: cargo deny check
