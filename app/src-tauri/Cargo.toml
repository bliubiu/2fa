[package]
name = "two-fa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "2FA 两步验证器桌面 GUI（Tauri 壳）"
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
# 系统文件对话框（导出另存）：Windows IFileDialog / macOS NSSavePanel / Linux GTK，
# 均为系统 API 声明绑定（同 tauri、arboard 口径），不引入 C/C++ 库源码
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
data-encoding = "2"
two_fa_core = { package = "two-fa-core", path = "../../crates/2fa-core" }
